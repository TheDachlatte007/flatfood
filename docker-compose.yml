services:
  flatfood:
    image: ghcr.io/thedachlatte007/flatfood:latest
    container_name: flatfood
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATA_DIR=/data
      - PARSER=auto
      - GEMINI_MODEL=gemini-3.8-flash
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
